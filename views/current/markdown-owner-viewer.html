    const sourcePack = {"generated_at": "2026-07-31T17:42:11", "source_revision": "ffbd8ca", "items": {"governance/topic-visual-presentation-rules.md": {"owner_path": "governance/topic-visual-presentation-rules.md", "title": "Topic Visual Presentation Rules", "markdown": "---\ntype: governance\nid: GOV-TOPIC-VISUAL-PRESENTATION-001\nstatus: active\nsource_of_truth: true\nupdated: 2026-07-29\n---\n\n# Topic Visual Presentation Rules\n\n```yaml\ntopic_presentation_profile:\n  repository: wiki\n  need: required\n  existing_skill: skills/topic-visual-presentation/SKILL.md\n  local_owner_roots: [skills/, concepts/, templates/, governance/, views/, scripts/]\n  renderer: Google Chrome headless with same-source PDF/PNG readback\n  design_system: semantic-static HTML, accessibility-first hierarchy, single visual purpose\n  evidence_layers: [contract-schema, semantic-content, visual-quality, delivery-findability, reader-utility]\n  views_layer: views/current/, views/snapshots/, views/lens-registry.md\n  publication: skills/public-html-publish/SKILL.md and views/publication.md\n  local_deltas: canonical-only cutover, all-runtime residual scan, mutation fixtures\n  compatibility: grandfather legacy local HTML/lens_id via baseline manifest\n  sample_set: topic current sample plus canonical problem-focus fixture\n  validation: check_topic_visual_presentation, runtime export readback, public live/deny, check_all, git diff --check\n```\n\n[[skills/topic-visual-presentation/SKILL]] 是唯一运行入口。先做 presentation eligibility，再冻结 subject_package、source_pack、reader contract 和三轴；`admit` 默认 HTML，inline/ephemeral/current/snapshot 默认同源 PDF/PNG 到临时或 ignored exports。\n\n主题、项目 owner 和独立知识不可混同：`projects/` 维护项目事实，`articles/` / `concepts/` 维护独立知识；视图和导出不成为 truth source。problem-focus 仅是 content_scope。\n\n五门 evaluator（contract-schema、semantic-content、visual-quality、delivery-findability、reader-utility）独立且不得上推。semantic-content 必须同时有确定性 sensor、builder-independent model judge 与版本化 rubric/calibration/trace；无真实 reader oracle 则 reader-utility=unproven。没有通用人工 veto。\n\n`views/` 仅承接 canonical current/snapshot；registry 记录 source、refresh 和五门边界。旧 artifact 仅按 legacy baseline grandfather；同路径刷新须 pre/post hash、reason 和 compatibility readback。公开发布遵守 [[governance/public-html-publish-rules]]；本仓当前没有已发布页面，其他工程的发布读回不能作为本仓证据。\n", "raw_href": "../../governance/topic-visual-presentation-rules.md"}, "skills/topic-visual-presentation/SKILL.md": {"owner_path": "skills/topic-visual-presentation/SKILL.md", "title": "Topic Visual Presentation", "markdown": "---\nname: topic-visual-presentation\ndescription: 主题级图文呈现的唯一运行入口；把即时 subject_package 与 source_pack 组织为默认 HTML，并生成同源 PDF/PNG。\nmaturity: adopted\nevidence_signals: [skill, concept, template, governance, sensor, fixtures, legacy-baseline, current-sample]\ntransfer_ready: true\nsensor: python3 scripts/check_all.py --only topic-visual-presentation\n---\n\n# Topic Visual Presentation\n\n## 定位\n\n这是本仓主题信息呈现的唯一活动入口。调用不要求已有 Topic 文档：对话、文件、页面和临时材料可即时规范化为 `subject_package` 与 `source_pack`。项目事实仍由 `projects/` owner 保存，独立知识仍由 `articles/`、`concepts/` 保存；本技能只生成派生呈现。\n\n## 成熟度与证据信号\n\n`evidence_signals` 覆盖 skill、concept、template、governance、sensor、fixtures、legacy baseline 和 current sample；`evidence boundary` 是 structure/readback 不能上推为独立语义、视觉或 reader-utility 通过。\n\n## 准入与输入\n\n先裁决 `presentation_eligibility: admit | reject | clarify | abstain`。普通短答、显式 text-only 或信息不足以改变结构时不强制呈现；`admit` 后 `primary_format=html`，非 HTML 或缺少 PDF/PNG 必须记录 fallback reason。\n\n```yaml\nsubject_package: {subject_id: , user_goal: , subject_boundary: , known_facts: [], unknowns: [], owner_refs: []}\nsource_pack: {sources: [], source_revision: , freshness: , contradictions: [], evidence_bindings: []}\nintent_routing_contract:\n  content_scope: topic | problem-focus | not-applicable\n  materialization_need: inline | ephemeral | canonical-current | snapshot | not-applicable\n  confidence: {value: , calibration_revision: }\n  decision: route | clarify | abstain\n```\n\n`content_scope=topic` 是默认；`content_scope=problem-focus` 只是内容子范围。`canonical-current` 进入运行时唯一规范化为 `current`。confidence 必须来自版本化 calibration，而不是模型自报。\n\n## 运行合同\n\n`information_graph` 保留带来源和生命周期的 units 与 typed_relations；`organization_plan` 记录选取、遗漏、主视觉和理由；`reader_adaptation_profile` 只使用显式任务与偏好证据。\n\n```yaml\nruntime_axes: {task_state: understand|compare|decide|act|verify|review, content_scope: topic|problem-focus, materialization: inline|ephemeral|current|snapshot}\nrepresentation:\n  primary_format: html\n  html_profile: semantic-static | interactive\n  same_source_exports: [pdf, png]\n  export_policy: required-by-default\n  export_workspace_kind: runtime-temporary | gitignored-exports\n```\n\ninline、ephemeral、current、snapshot 都默认生成并读回同源 PDF/PNG。仓内导出进入 Git-ignored `views/.exports/`；不提交为第二事实源。\n\n## 五门 evaluator\n\n| 门 | 证明 | 不能上推 |\n| --- | --- | --- |\n| contract-schema | package、枚举、revision、representation | 内容正确 |\n| semantic-content | 来源绑定、未知项、独立模型 judge、版本化 rubric/trace | 视觉、发布或效用 |\n| visual-quality | 独立 reviewer、可访问性、PDF/PNG readback | 语义正确 |\n| delivery-findability | canonical、registry、exports、public live/deny | 读者任务成功 |\n| reader-utility | 真实读者任务 oracle | 业务状态关闭 |\n\n五门独立，任一 pass 都不能提升其他门。没有 builder-independent judge 或真实 reader task 时分别保持 `unproven`；不存在通用人工 veto。业务授权和验收仍回到 owner。\n\n## 兼容与边界\n\n旧 HTML、current、snapshot、lens_id 与 registry entry 由 `scripts/fixtures/topic-visual-presentation/legacy_artifact_baseline_manifest.v1.json` grandfather。未修改旧 artifact 不追补新 schema；同路径刷新必须记录 pre/post hash、reason 和 compatibility readback。`public-html-publish` 是独立能力，本仓当前没有已发布页面。\n\n相关入口：[[concepts/topic-information-presentation]]、[[templates/topic-presentation-template]]、[[governance/topic-visual-presentation-rules]]、[[skills/public-html-publish/SKILL]]。\n\n## 工作流\n\n按 eligibility → packages → information graph → organization/adaptation → HTML → same-source exports → five gates 执行；拒绝、澄清和 abstain 不 materialize artifact。\n\n## 输出格式\n\n输出 eligibility、subject/source、三轴、canonical/export refs、五门状态、cannot-promote 与 persistence decision。\n\n## 禁止项\n\n不把 builder 自评当 independent judge；不以导出件替代 truth；不把历史 legacy artifact 变成 alias 或重写其文本；不以任一 gate 通过关闭业务 owner。\n", "raw_href": "../../skills/topic-visual-presentation/SKILL.md"}, "templates/topic-presentation-template.md": {"owner_path": "templates/topic-presentation-template.md", "title": "Topic Presentation Contract", "markdown": "---\ntemplate_type: topic-presentation-contract\ncontract_revision: topic-presentation-contract.v1\n---\n\n# Topic Presentation Contract\n\n```yaml\npresentation_eligibility: admit | reject | clarify | abstain\nintent_routing_contract:\n  speech_acts: []\n  reader_tasks: []\n  content_scope: topic | problem-focus | not-applicable\n  materialization_need: inline | ephemeral | canonical-current | snapshot | not-applicable\n  confidence: {value: , calibration_revision: }\n  ambiguity: {type: none | multi-intent | missing-context | conflict | out-of-scope, unresolved_axes: []}\n  decision: route | clarify | abstain\n  reason_codes: []\nsubject_package: {subject_id: , user_goal: , subject_boundary: , known_facts: [], unknowns: [], owner_refs: []}\nsource_pack: {sources: [], source_revision: , freshness: , contradictions: [], evidence_bindings: []}\ninformation_graph: {units: [], typed_relations: []}\norganization_plan: {plan_revision: , reader_task: , topic_shape: , selected_units: [], omitted_units: [], section_graph: [], primary_visual: {paradigm: , encoded_relations: []}, alternatives: [], decision_rationale: , uncertainty: [], provenance_refs: []}\nreader_adaptation_profile: {reader_task: , prior_knowledge: unknown | novice | working | expert, time_budget: , device: , accessibility_needs: [], interaction_need: , density_preference: , language_complexity: , evidence_depth: , explicit_preferences: [], preference_provenance: [], confidence: , expires_at: }\nruntime_axes: {task_state: understand | compare | decide | act | verify | review, content_scope: topic | problem-focus, materialization: inline | ephemeral | current | snapshot}\nrepresentation: {primary_format: html, html_profile: semantic-static | interactive, same_source_exports: [pdf, png], export_policy: required-by-default, export_workspace_kind: runtime-temporary | gitignored-exports, export_readback: {html: , pdf: , png: }, fallback_reason: }\nevaluation:\n  contract-schema: {deterministic_sensor: }\n  semantic-content: {deterministic_sensor: , independent_model_judge: , rubric_revision: , calibration_revision: , trace_ref: }\n  visual-quality: {independent_reviewer: , review_artifact: }\n  delivery-findability: {canonical_ref: , export_refs: [], findability_readback: }\n  reader-utility: {task_oracle: , result_ref: }\nartifact_compatibility: {legacy_artifact_baseline_manifest: , legacy_policy: grandfather-unmodified, refresh_policy: same-path-upgrade, public_html_publish: independent}\n```\n\n结构、fixture 与 canonical check key 通过的上限是 `structure-ready`；没有真实 artifact/readback、独立 judge trace 或 reader oracle 不能上推。\n", "raw_href": "../../templates/topic-presentation-template.md"}, "views/lens-registry.md": {"owner_path": "views/lens-registry.md", "title": "Lens Registry", "markdown": "---\ntype: registry\nid: VIEWS-LENS-REGISTRY-001\nscope: shared\nstatus: active\nsource_of_truth: true\nupdated: 2026-06-25\ntags: [views, lens, registry]\n---\n\n# Lens Registry\n\n本页登记 `views/` 下的持久 lens。\n\n每条记录至少写清：`lens_id`、`path`、`lens_type`、`focus_object`、`judgement_purpose`、`source_pages`、`generated_at`、`source_revision`、`evidence_boundary`、`output_mode`、`visual_structure`、`art_direction_brief`、`page_paradigm`、`component_semantic_manifest`、`static_visual_qa`、`export_profile`、`print_profile`、`equivalence_profile`、`default_auto_exports`、`conversation_png_preview`、`canonical_policy`、`snapshot_policy`、`staleness_policy` 和 `refresh_trigger`。\n\n每条记录还要能回到 source pack，并用中文写清证据边界、未读来源、同源导出关系和不能上推范围。PDF / PNG / SVG 导出缓存必须进入 gitignore 忽略目录，不作为 registry 的事实源。\n\n## Current canonical\n\n### topic-visual-presentation-system\n\n- `path`: `views/current/topic-visual-presentation-system.html`\n- `lens_type`: `topic information presentation system sample`\n- `source_pages`: `skills/topic-visual-presentation/SKILL.md`; `governance/topic-visual-presentation-rules.md`; `templates/topic-presentation-template.md`\n- `generated_at`: `2026-07-29`\n- `source_revision`: topic canonical cutover working tree\n- `evidence_boundary`: contract-schema and local export readback only; independent semantic judge, independent visual review and reader utility remain unproven.\n- `output_mode`: `current semantic-static html`\n- `exports`: same-source PDF / PNG at `views/.exports/topic-visual-presentation-system/` and ignored by Git.\n- `refresh_trigger`: skill, rule, template, schema, publication profile or renderer changes.\n- `cannot_promote`: this view cannot replace owner pages or prove semantic, visual, delivery or reader-utility gates beyond its stated evidence.\n\n## Legacy grandfather artifacts\n\nThe entries below are retained for local path / lens_id compatibility under `scripts/fixtures/topic-visual-presentation/legacy_artifact_baseline_manifest.v1.json`; they are not public pages, canonical runtime entries or aliases.\n\n### markdown-owner-viewer-current\n\n- `lens_id`: `markdown-owner-viewer-current`\n- `path`: `views/current/markdown-owner-viewer.html`\n- `lens_type`: `resource / owner`\n- `focus_object`: rendered Markdown owner-page viewer for current HTML lens links\n- `source_pages`: `views/current/**/*.html`; linked repository Markdown owner pages\n- `generated_at`: `2026-07-24`\n- `source_revision`: generated by `python3 scripts/update_current_markdown_owner_viewer.py`\n- `evidence_boundary`: confirmed for packed owner Markdown rendering, browser-parseable JavaScript and current local HTML link rewriting; source pages remain Markdown truth sources; no public publication is configured.\n- `output_mode`: `current html utility viewer`\n- `canonical_policy`: tracked HTML viewer is regenerated from current HTML links and Markdown owner source pack.\n- `refresh_trigger`: current HTML links to Markdown owner pages, linked owner Markdown or viewer script changes.\n\n### problem-focused-visual-presentation-system-sample\n\n- `lens_id`: `problem-focused-visual-presentation-system-sample`\n- `path`: `views/current/problem-focused-visual-presentation-system-sample.html`\n- `lens_type`: `knowledge / status / acceptance validation sample`\n- `focus_object`: problem-focused visual presentation system in this wiki\n- `judgement_purpose`: validate that the local lens system covers trigger rules, source pack, visual strategy, static visual QA, registry and same-source export flow\n- `source_pages`: historical source pack embedded in the unchanged legacy HTML; retired paths are not runtime dependencies.\n- `generated_at`: `2026-06-25`\n- `source_revision`: current working tree at generation time; commit hash must be read from git after commit\n- `evidence_boundary`: confirmed for local structure and generated export artifacts; blocked for public URL, human design approval and source truth completeness beyond the listed source pack\n- `output_mode`: `current html_report / print_view`\n- `visual_structure`: concept map + validation matrix + evidence strip + timeline\n- `art_direction_brief`: restrained technical control room with a single source-truth-to-export path as the visual hero\n- `page_paradigm`: `concept map / matrix / operations map`\n- `component_semantic_manifest`: stored in the HTML manifest under `component_semantic_manifest`\n- `static_visual_qa`: stored in the HTML manifest under `static_visual_qa`\n- `export_profile`: same-source PDF and PNG are generated to `views/current/.exports/`; exports are ignored and not truth sources\n- `print_profile`: A4 print CSS from the canonical HTML\n- `equivalence_profile`: HTML / PDF / PNG share the same canonical HTML and manifest\n- `default_auto_exports`: `pdf+png` when the HTML is generated or refreshed\n- `conversation_png_p     const viewerVersion = encodeURIComponent(sourcePack.generated_at || sourcePack.source_revision || "current");
    const params = new URLSearchParams(window.location.search);
    const requestedPath = params.get("path") || "";
    const pathNode = document.getElementById("path");
    const titleNode = document.getElementById("title");
    const bodyNode = document.getElementById("body");
    const rawLink = document.getElementById("rawLink");
    const fallbackLink = document.getElementById("fallbackLink");
    const listNode = document.getElementById("ownerList");
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function renderInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
        return `<code>[${label}](${href})</code>`;
      });
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\[\[([^\]]+)\]\]/g, "<code>[[$1]]</code>");
      return out;
    }
    function renderMarkdown(md) {
      const lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;
      let inCode = false;
      let code = [];
      let listType = null;
      function closeList() {
        if (!listType) return;
        out.push(listType === "ol" ? "</ol>" : "</ul>");
        listType = null;
      }
      while (i < lines.length) {
        const line = lines[i];
        if (line.trim().startsWith("```")) {
          closeList();
          if (inCode) {
            out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
            inCode = false;
            code = [];
          } else {
            inCode = true;
            code = [];
          }
          i += 1;
          continue;
        }
        if (inCode) {
          code.push(line);
          i += 1;
          continue;
        }
        if (!line.trim()) {
          closeList();
          i += 1;
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          out.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
          i += 1;
          continue;
        }
        if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())) {
          closeList();
          out.push("<hr>");
          i += 1;
          continue;
        }
        if (line.trim().startsWith(">")) {
          closeList();
          const quote = [];
          while (i < lines.length && lines[i].trim().startsWith(">")) {
            quote.push(lines[i].replace(/^\s*>\s?/, ""));
            i += 1;
          }
          out.push("<blockquote>" + quote.map((part) => `<p>${renderInline(part)}</p>`).join("") + "</blockquote>");
          continue;
        }
        const ordered = line.match(/^\s*(\d+)\.\s+(.*)$/);
        if (ordered) {
          if (listType !== "ol") {
            closeList();
            listType = "ol";
            out.push("<ol>");
          }
          out.push(`<li>${renderInline(ordered[2])}</li>`);
          i += 1;
          continue;
        }
        const bullet = line.match(/^\s*[-*]\s+(.*)$/);
        if (bullet) {
          if (listType !== "ul") {
            closeList();
            listType = "ul";
            out.push("<ul>");
          }
          out.push(`<li>${renderInline(bullet[1])}</li>`);
          i += 1;
          continue;
        }
        closeList();
        const tableLines = [];
        let j = i;
        while (j < lines.length && lines[j].includes("|")) {
          tableLines.push(lines[j]);
          j += 1;
        }
        if (
          tableLines.length >= 2 &&
          /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(tableLines[1])
        ) {
          const splitRow = (row) =>
            row
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((cell) => cell.trim());
          const headers = splitRow(tableLines[0]);
          out.push("<table><thead><tr>" + headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("") + "</tr></thead><tbody>");
          for (const row of tableLines.slice(2)) {
            const cells = splitRow(row);
            out.push("<tr>" + cells.map((cell) => `<td>${renderInline(cell)}</td>`).join("") + "</tr>");
          }
          out.push("</tbody></table>");
          i = j;
          continue;
        }
        out.push(`<p>${renderInline(line)}</p>`);
        i += 1;
      }
      closeList();
      return out.join("");
    }

    function viewerUrl(ownerPath) {

    function renderOwner(ownerPath, updateUrl = false) {

        pathNode.textContent = "当前 source pack 为空";

        rawLink.style.display = "none";
        return;
      }
      titleNode.textContent = chosen.title || chosen.owner_path;
      pathNode.textContent = chosen.owner_path;
      bodyNode.innerHTML = `<div class="md-prose">${renderMarkdown(chosen.markdown || "")}</div>`;
      rawLink.href = chosen.raw_href || "#";

      if (listNode) {
        listNode.querySelectorAll("[data-owner-path]").forEach((button) => {
          button.classList.toggle("active", button.dataset.ownerPath === chosen.owner_path);
        });
      }
      if (updateUrl && window.history && window.history.replaceState) {

      }
    }
    if (listNode) {
      listNode.innerHTML = entries.map((item) => {
        return `<button type="button" class="owner-link" data-owner-path="${escapeHtml(item.owner_path)}">
          <div class="owner-name">${escapeHtml(item.title || item.owner_path)}</div>
          <div class="owner-path">${escapeHtml(item.owner_path)}</div>
        </button>`;
      }).join("");
      listNode.querySelectorAll("[data-owner-path]").forEach((button) => {
        button.addEventListener("click", () => {
          renderOwner(button.dataset.ownerPath || "", true);
        });
      });
    }
    renderOwner(requestedPath, false);
    
  })();</script>
